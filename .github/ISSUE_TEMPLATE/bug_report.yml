name: Баг
description: Что-то работает не так
labels: ["bug"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Компонент
      options:
        - internal
        - external
        - shared
        - launcher
        - website
    validations:
      required: true

  - type: dropdown
    id: build
    attributes:
      label: Сборка
      options:
        - dev (SHADOW_DEV_BUILD=ON)
        - user (без флага)
        - воспроизводится в обеих
    validations:
      required: true

  - type: input
    id: revision
    attributes:
      label: Ветка и коммит
      placeholder: internal @ a23f758

  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Что должно происходить
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Что происходит на самом деле
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Логи, краш-дамп, скриншот
      description: Из dev-сборки сюда удобно вставить вывод консоли
      render: text
